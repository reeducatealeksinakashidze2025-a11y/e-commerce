<!-- product-card.component.html -->
<div class="product-card" (click)="onView()">
  <div class="product-image">
    <img [src]="getMainImage()" [alt]="product.name">
    <span *ngIf="product.isDiscounted" class="discount-badge">
      <i class="fas fa-tag"></i>
      {{ 'product.discounted' | translate }}
    </span>
  </div>
  
  <div class="product-details">
    <div class="product-category">
      {{ getCategoryName() }}
    </div>
    
    <h3 class="product-name">{{ product.name }}</h3>
    
    <p class="product-description" *ngIf="product.description">
      {{ product.description | slice:0:100 }}{{ product.description.length > 100 ? '...' : '' }}
    </p>
    
    <div class="product-footer">
      <div class="product-price">
        {{ product.price | currency:'GEL':'symbol':'1.2-2' }}
      </div>
      
      <div class="product-quantity">
        <i class="fas fa-boxes"></i>
        {{ product.quantity }}
      </div>
    </div>
    
    <div class="product-actions" (click)="$event.stopPropagation()">
      <button class="btn btn-sm btn-outline-primary" (click)="onView()">
        <i class="fas fa-eye"></i>
        {{ 'product.buttons.view' | translate }}
      </button>
      <button class="btn btn-sm btn-outline-secondary" (click)="onEdit()">
        <i class="fas fa-edit"></i>
        {{ 'product.buttons.edit' | translate }}
      </button>
    </div>
  </div>
</div>
