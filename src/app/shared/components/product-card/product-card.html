<div class="product-card">
  <h2>{{ product.name }}</h2>
  <p class="category">Category: {{ product.category }}</p>
  <p *ngIf="product.description">{{ product.description }}</p>

  <div class="details">
    <span>Quantity: {{ product.quantity }}</span>
    <span>Price: {{ product.price | currency:'USD' }}</span>
  </div>
</div>
