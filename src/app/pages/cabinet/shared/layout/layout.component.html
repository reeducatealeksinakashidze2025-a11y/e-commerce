<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-light" data-bs-theme="light">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/">
        <strong>e-Commerce</strong>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
              <i class="bi bi-speedometer2"></i> {{ 'CABINET.DASHBOARD.TITLE' | translate }}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="products" routerLinkActive="active">
              <i class="bi bi-box"></i> {{ 'CABINET.PRODUCTS.TITLE' | translate }}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="cart" routerLinkActive="active">
              <i class="bi bi-cart"></i> {{ 'CABINET.CART.TITLE' | translate }}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="orders" routerLinkActive="active">
              <i class="bi bi-bag-check"></i> {{ 'CABINET.ORDERS.TITLE' | translate }}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="profile" routerLinkActive="active">
              <i class="bi bi-person"></i> {{ 'CABINET.PROFILE.TITLE' | translate }}
            </a>
          </li>
        </ul>
      </div>

      <div class="d-flex align-items-center gap-3 ms-3">
        <!-- Language Switcher -->
        <div class="lang-switch">
          <button class="btn btn-sm" [class.active]="currentLang === 'en'" (click)="switchLang('en')">EN</button>
          <button class="btn btn-sm" [class.active]="currentLang === 'ka'" (click)="switchLang('ka')">KA</button>
        </div>
        <!-- Logout button -->
        <button class="btn btn-sm btn-outline-danger" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> {{ 'CABINET.PROFILE.LOGOUT' | translate }}
        </button>
      </div>
    </div>
  </nav>
</header>
<main id="main" class="layout-main" role="main">
  <div class="content-container">
    <router-outlet></router-outlet>
  </div>
</main>
<footer class="layout-footer">
  <div class="content-container">
    <app-footer></app-footer>
  </div>
