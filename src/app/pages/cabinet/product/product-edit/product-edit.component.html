<!-- product-edit.component.html -->
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ 'product.titles.edit' | translate }}</h2>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">{{ 'common.loading' | translate }}</span>
    </div>
  </div>

  <div *ngIf="!isLoading">
    <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
      {{ errorMessage }}
      <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
    </div>

    <app-product-fields [productForm]="productForm"></app-product-fields>
    
    <app-file-upload 
      [maxFiles]="5"
      [maxFileSize]="5242880"
      acceptedTypes="image/*"
      [existingImages]="existingImages"
      (filesSelected)="onFilesSelected($event)"
      (existingImageRemoved)="onExistingImageRemoved($event)">
    </app-file-upload>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button 
        class="btn btn-secondary"
        (click)="cancel()"
        [disabled]="isSubmitting">
        <i class="fas fa-times"></i>
        {{ 'product.buttons.cancel' | translate }}
      </button>
      <button 
        class="btn btn-primary" 
        (click)="update()"
        [disabled]="isSubmitting || productForm.invalid">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!isSubmitting" class="fas fa-save me-1"></i>
        {{ isSubmitting ? ('common.loading' | translate) : ('product.buttons.update' | translate) }}
      </button>
    </div>
  </div>
</div>
