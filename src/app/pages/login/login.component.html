<form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
  <h2 class="form-title">{{ 'LOGIN.TITLE' | translate }}</h2>
  <div *ngIf="loginError" class="error-message">{{ loginError }}</div>
  <div class="form-group">
    <label for="email">{{ 'LOGIN.EMAIL' | translate }}</label>
    <input type="text" id="email" name="Email" [(ngModel)]="email" required />
  </div>
  <div class="form-group">
    <label for="password">{{ 'LOGIN.PASSWORD' | translate }}</label>
    <input type="password" id="password" name="password" [(ngModel)]="password" required />
  </div>
  <button type="submit" [disabled]="!loginForm.valid" class="btn">{{ 'LOGIN.BUTTON' | translate }}</button>
  <p class="register-link">
    {{ 'LOGIN.NO_ACCOUNT' | translate }} 
    <a routerLink="/auth/register">{{ 'LOGIN.REGISTER_HERE' | translate }}</a>
  </p>
  <p class="home-link">
    <a routerLink="/">{{ 'LOGIN.BACK_HOME' | translate }}</a>
  </p>
</form>
